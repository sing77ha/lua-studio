name: Build Debug APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (useful if you just want to rebuild
# without pushing a new commit).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This repo does not include a committed Gradle Wrapper
      # (gradlew / gradle-wrapper.jar), so this step installs Gradle
      # directly on the runner and uses it for every command below.
      # If you later add a wrapper (Android Studio will generate one for
      # you automatically on first open), you can switch these steps back
      # to `./gradlew ...` instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        continue-on-error: true
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
